{% extends "blog/base.html" %}

{% block title %}
  標籤列表 - Django Blog
{% endblock title %}

{% block blog_content %}
  <h2 class="mb-4">  
    標籤列表
  </h2>
  <div class="row">
    {% for tag in tags %}
      <div class="col-md-6 col-lg-3 mb-4">
        <div class="card h-100">
          <div class="card-body text-center">
            <h5 class="card-title">
              <i class="bi bi-tag-fill"></i> {{ tag.name }}
            </h5>
            <hr>
            <p class="text-muted small mb-0">
              <i class="bi bi-file-text"></i> 文章數: {{ tag.articles.count }}
            </p>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <div class="alert alert-info">  
          目前沒有標籤
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock blog_content %}
